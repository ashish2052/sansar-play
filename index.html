<style>
:root{--ink:#2a1a10;--card:rgba(48,28,18,.82);--cream:#fff4dc;--gold:#f2b630;--brick:#c4553a;--green:#56b36b;--blue:#4a9fd9;--pink:#e46a8c;--r:14px}

button{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;border:1px solid rgba(255,230,180,.25);min-height:44px;transition:transform .08s,background .15s}

#year{position:absolute;left:max(10px,env(safe-area-inset-left));top:168px;width:min(260px,58vw);font-size:.78rem;line-height:1.35;pointer-events:none!important}
#year p{margin:0 0 4px;background:rgba(48,28,18,.7);border-radius:10px;padding:6px 9px;animation:in .35s both}

#ageBtn{box-shadow:0 6px 22px rgba(0,0,0,.35)}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,244,220,.18);border:2px solid rgba(255,244,220,.5);touch-action:none}
#runBtn{position:absolute;left:max(160px,calc(env(safe-area-inset-left) + 150px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 40px));width:62px;height:62px;border-radius:50%;background:rgba(255,244,220,.18);border:2px solid rgba(255,244,220,.5);font-weight:800;font-size:.78rem;letter-spacing:.04em;touch-action:manipulation}#runBtn.on{background:var(--gold);color:#3a2216;border-color:#fff3c4}

#toast div{background:rgba(255,244,220,.96);color:var(--ink);font-weight:700;padding:8px 14px;border-radius:12px;font-size:.88rem;text-align:center;animation:in .25s both;box-shadow:0 4px 14px rgba(0,0,0,.3)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.opts.one{grid-template-columns:1fr}
.opt{background:rgba(255,244,220,.1);border:1px solid rgba(255,230,180,.28);border-radius:12px;padding:10px 12px;text-align:left;min-height:56px;display:flex;flex-direction:column;gap:2px}

.opt .tag{align-self:flex-start;margin-top:3px;font-size:.7rem;background:var(--gold);color:var(--ink);border-radius:6px;padding:1px 7px;font-weight:800}
.hdr{margin:12px 0 4px;font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
